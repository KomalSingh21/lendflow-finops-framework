service: loan-application-api
autoscaling:
  min_capacity: 4
  max_capacity: 20
  desired_capacity: 4
  scale_out:
    metric: ALBRequestCountPerTarget
    threshold: 70
    evaluation_periods: 2
    cooldown_seconds: 120
    action: add_2
  scale_in:
    metric: ALBRequestCountPerTarget
    threshold: 45
    evaluation_periods: 15
    cooldown_seconds: 900
    action: remove_1
spot:
  max_percentage: 30
compliance:
  - PCI_DSS_isolation
  - RBI_redundancy
