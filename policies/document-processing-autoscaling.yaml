service: document-processing
autoscaling:
  min_capacity: 2
  max_capacity: 30
  scale_out:
    metric: sqs_backlog_per_worker
    threshold: 30
    evaluation_periods: 2
    cooldown_seconds: 120
    action: add_2
  scale_in:
    metric: sqs_backlog_per_worker
    threshold: 10
    evaluation_periods: 20
    cooldown_seconds: 1200
    action: remove_1
spot:
  max_percentage: 70
compliance:
  - GDPR_data_localization
  - immutable_audit_trail
  - interruption_safe_processing
